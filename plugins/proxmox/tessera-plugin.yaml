# Proxmox: a node's or a guest's status, CPU, memory and disk, and a list of guests or services that are up or down.
# The data comes from Home Assistant's Proxmox VE integration (or any sensor that says the same): the plugin reads the
# entities a person chooses in the inspector (options of kind entity, plugin API 0.15). Every field is explained in
# docs/MANIFEST.md of tessera-plugins.
id: proxmox
version: 0.4.1
api: "0.18"
icon: monitor
maintainer: willobarboza
license: MIT
stage: beta
topics: [tech, home]
requires:
  esphome: 2026.6.2
boards: any
flash_kb: 14

permissions:
  # The control card presses the button entities a person chose for a node tile (start, shut down, restart).
  home_assistant_actions: [button.press]
  # The card's chart: a sensor's hourly means of the last day, from Home Assistant's long-term statistics.
  ha_commands: [recorder/statistics_during_period]
  # The problem sensor the top bar's item and the popup read (plugin.yaml).
  read_entities: ["{problem}"]

inputs:
  - { id: problem, kind: entity, domains: [binary_sensor], scope: screen, label: input_problem, hint: input_problem_hint }

answers:
  - command: recorder/statistics_during_period
    fields:
      means: { path: "[*][*].mean", as: numbers }

tiles:
  # A node or a guest: whether it runs, and its CPU, memory and disk as bars.
  - id: node
    name: node_name
    icon: monitor
    sizes: { min: 1x1, max: 9x9 }
    # A title, a dot, a status line and three rows of a name, a value and a bar.
    memory: 1700
    example: node_example
    options:
      - { id: status, kind: entity, domains: [binary_sensor, sensor, switch], attributes: [device_class], label: status, hint: status_hint }
      - { id: cpu, kind: entity, domains: [sensor], attributes: [unit_of_measurement], label: cpu, hint: percent_hint }
      - { id: memory, kind: entity, domains: [sensor], attributes: [unit_of_measurement], label: memory, hint: percent_hint }
      - { id: disk, kind: entity, domains: [sensor], attributes: [unit_of_measurement], label: disk, hint: percent_hint }
      - { id: start, kind: entity, domains: [button], label: key_start, hint: keys_hint }
      - { id: shutdown, kind: entity, domains: [button], label: key_shutdown }
      - { id: reboot, kind: entity, domains: [button], label: key_reboot }

  # Up to eight guests, services or sensors: a status as a dot and a word, a number as its value and unit, and a line
  # over them that says how many are down.
  - id: status_list
    name: list_name
    icon: check-network-outline
    sizes: { min: 1x1, max: 9x9 }
    # A head line and eight rows of a dot, a name and a state.
    memory: 3800
    example: list_example
    options:
      - { id: item_1, kind: entity, domains: [binary_sensor, sensor, switch], attributes: [device_class, unit_of_measurement], label: item_1, hint: item_hint }
      - { id: item_2, kind: entity, domains: [binary_sensor, sensor, switch], attributes: [device_class, unit_of_measurement], label: item_2 }
      - { id: item_3, kind: entity, domains: [binary_sensor, sensor, switch], attributes: [device_class, unit_of_measurement], label: item_3 }
      - { id: item_4, kind: entity, domains: [binary_sensor, sensor, switch], attributes: [device_class, unit_of_measurement], label: item_4 }
      - { id: item_5, kind: entity, domains: [binary_sensor, sensor, switch], attributes: [device_class, unit_of_measurement], label: item_5 }
      - { id: item_6, kind: entity, domains: [binary_sensor, sensor, switch], attributes: [device_class, unit_of_measurement], label: item_6 }
      - { id: item_7, kind: entity, domains: [binary_sensor, sensor, switch], attributes: [device_class, unit_of_measurement], label: item_7 }
      - { id: item_8, kind: entity, domains: [binary_sensor, sensor, switch], attributes: [device_class, unit_of_measurement], label: item_8 }
      # Names of the person's own, in the order of the items, for names an integration made long ("arco-(124) Status").
      - { id: names, kind: text, label: names, hint: names_hint }

# A tap on a node tile opens it large: its last 24 hours as a chart, and keys that start, shut down or restart it.
cards:
  - { id: control, name: card_name, wide: true }

# Something is down: its name in the top bar, red, on every page that has the item.
bar_items:
  - { id: problems, label: bar_problems, icon: alert-circle, example: bar_example }

# A step of the screensaver that shows only while something is down: what, large, on the black glass.
savers:
  - id: problems
    name: saver_problems
    icon: alert-circle
    step: own
    memory: 1000
    domains: [binary_sensor]
    attributes: [problems]
    when: { state: ["on"] }
    example: saver_example

# The setting of plugin.yaml: whether a problem shows a popup over the screen.
settings:
  - { key: proxmox_popup, label: setting_popup, hint: setting_popup_hint }
